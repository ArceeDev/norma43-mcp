[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "norma43-mcp"
version = "0.2.0"
description = "MCP server for Spanish bank statements (Norma 43 / Cuaderno 43) and bank reconciliation. Billed per call with KeyFlint credits."
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "ArceeDev" }]
keywords = ["mcp", "norma43", "cuaderno43", "aeb43", "conciliacion-bancaria", "bank-reconciliation", "sepa", "iban", "spain"]
dependencies = [
    "mcp>=2.0",
    "keyflint-verify[fast]>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
norma43-mcp = "norma43_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ArceeDev/norma43-mcp"
Source = "https://github.com/ArceeDev/norma43-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
